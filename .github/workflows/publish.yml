name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify package and tag
        run: |
          node -e "const p=require('./aimrule/package.json'); if(p.private) throw new Error('package is private'); if(p.name!=='@aimrule/dsh-plugin-flow') throw new Error('unexpected package name: '+p.name); console.log('Publishing', p.name, p.version)"
          VERSION=$(node -p "require('./aimrule/package.json').version")
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "Tag ${{ github.ref_name }} does not match package version v$VERSION" >&2
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./aimrule --access public 2>&1 | tee publish.log

      - name: Publish log on failure
        if: failure()
        run: cat publish.log || true
